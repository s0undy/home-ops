---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  chartRef:
    kind: OCIRepository
    name: echo
  interval: 1h
  values:
    config:
      # Response shaping (echo-delay / echo-code / echo-header) is off: echo is public
      # via the Cloudflare tunnel and echo-delay would let anyone hold connections open.
      commandsEnabled: false
      # X-Forwarded-For is only trusted from the pod and node networks, so the echoed
      # client IP and protocol reflect the real caller rather than Envoy's pod IP.
      trustedProxies: ["10.42.0.0/16", "10.0.100.0/24"]
    httpRoute:
      enabled: true
      hostnames: ["echo.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
