---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      homepage:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: homepage
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.1.2
            env:
              # Declared as a list, not a map: Kubernetes only expands $(VAR) for
              # variables defined earlier in the list, and app-template sorts a map
              # by key, which would put HOMEPAGE_ALLOWED_HOSTS before MY_POD_IP.
              - name: MY_POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              # The pod-IP entry is required, otherwise the kubelet probe's Host
              # header is rejected and the container never becomes ready.
              - name: HOMEPAGE_ALLOWED_HOSTS
                value: "$(MY_POD_IP):3000,homepage.${SECRET_DOMAIN}"
              - name: TZ
                value: "${TZ}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                  initialDelaySeconds: 5
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # app-template defaults this to false; kubernetes.yaml `mode: cluster` needs the
      # projected ServiceAccount token to authenticate against the API server.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      homepage: {}
    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            # namespaces/pods/nodes back the kubernetes and resources widgets
            - apiGroups: [""]
              resources: [namespaces, pods, nodes]
              verbs: [get, list]
            # gateways is required as well as httproutes: homepage reads the parent
            # Gateway's listener to decide whether a discovered link is http or https.
            - apiGroups: [gateway.networking.k8s.io]
              resources: [httproutes, gateways]
              verbs: [get, list]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage
    configMaps:
      config:
        data:
          kubernetes.yaml: |
            mode: cluster
            gateway: true
            ingress: false
            traefik: false
          settings.yaml: |
            title: home-ops
            headerStyle: clean
            layout:
              Media:
                style: row
                columns: 3
              Observability:
                style: row
                columns: 3
              Infrastructure:
                style: row
                columns: 3
          widgets.yaml: |
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: cluster
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
            - resources:
                backend: resources
                expanded: true
                cpu: true
                memory: true
          # Services are discovered from annotated HTTPRoutes, so this stays empty.
          services.yaml: ""
          bookmarks.yaml: ""
          docker.yaml: ""
          custom.css: ""
          custom.js: ""
    persistence:
      config:
        type: configMap
        identifier: config
        # Mounted file-by-file with subPath, per upstream's reference manifest.
        globalMounts:
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
            readOnly: true
          - path: /app/config/settings.yaml
            subPath: settings.yaml
            readOnly: true
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
            readOnly: true
          - path: /app/config/services.yaml
            subPath: services.yaml
            readOnly: true
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
            readOnly: true
          - path: /app/config/docker.yaml
            subPath: docker.yaml
            readOnly: true
          - path: /app/config/custom.css
            subPath: custom.css
            readOnly: true
          - path: /app/config/custom.js
            subPath: custom.js
            readOnly: true
      # homepage writes its log file here, so it must be writable.
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
