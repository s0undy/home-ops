---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      homepage:
        strategy: RollingUpdate
        annotations:
          # The generated ConfigMap has no name suffix hash, so roll on config change.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.1.2
            env:
              TZ: "${TZ}"
              LOG_TARGETS: stdout
              HOMEPAGE_ALLOWED_HOSTS: "homepage.${SECRET_DOMAIN}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    # HOMEPAGE_ALLOWED_HOSTS rejects the kubelet's IP-based Host header,
                    # so the probes present localhost, which homepage always allows.
                    httpHeaders: &probeHeaders
                      - name: Host
                        value: localhost:3000
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: *port
                    httpHeaders: *probeHeaders
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # app-template defaults this to false; kubernetes.yaml `mode: cluster` needs the
      # projected ServiceAccount token to authenticate against the API server.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      homepage: {}
    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            # namespaces/pods/nodes back the kubernetes and resources widgets
            - apiGroups: [""]
              resources: [namespaces, pods, nodes, services]
              verbs: [get, list]
            # gateways is required as well as httproutes: homepage reads the parent
            # Gateway's listener to decide whether a discovered link is http or https.
            - apiGroups: [gateway.networking.k8s.io]
              resources: [httproutes, gateways]
              verbs: [get, list]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage
    persistence:
      # Mounted as a whole directory rather than per-file subPaths, so homepage sees a
      # complete /app/config and never tries to initialize a missing skeleton file.
      config:
        type: configMap
        name: homepage-configmap
        globalMounts:
          - path: /app/config
            readOnly: true
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
      # Next.js writes its runtime cache here, which readOnlyRootFilesystem forbids.
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
