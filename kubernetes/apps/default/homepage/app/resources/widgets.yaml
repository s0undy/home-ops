---
- greeting:
    text_size: 4xl
    # Rewritten at runtime by custom.js; this is the no-JS fallback. The widget
    # renders nothing at all when text is empty, so it cannot be blank.
    text: Hello.

- search:
    provider: duckduckgo
    showSearchSuggestions: true
    target: _blank
    # Left false so a keypress opens quicklaunch, which searches discovered
    # services too, instead of being swallowed by the web-search box.
    focus: false

- datetime:
    text_size: sm
    format:
      timeStyle: short
      hourCycle: h23

# Not in index.jsx's rightAlignedWidgets, so this renders as a direct child of
# #widgets-wrap and custom.css can drop it onto its own row under the greeting.
- kubernetes:
    cluster:
      show: false
    nodes:
      show: true
      showLabel: true
