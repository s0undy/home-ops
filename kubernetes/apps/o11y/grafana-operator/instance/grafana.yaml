---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      # Keep the local form: grafana-operator manages the instance through
      # the local admin over basic auth. Auto-login hides it; break-glass via
      # /login?disableAutoLogin=true
      disable_login_form: "false"
      signout_redirect_url: https://auth.${SECRET_DOMAIN}/application/o/grafana/end-session/
    auth.generic_oauth:
      enabled: "true"
      name: authentik
      # client_id and client_secret come from the grafana-oidc Secret
      scopes: openid profile email entitlements
      auth_url: https://auth.${SECRET_DOMAIN}/application/o/authorize/
      token_url: https://auth.${SECRET_DOMAIN}/application/o/token/
      api_url: https://auth.${SECRET_DOMAIN}/application/o/userinfo/
      use_pkce: "true"
      auto_login: "true"
      # Roles come from Authentik application entitlements; users without
      # one are refused login
      allow_assign_grafana_admin: "true"
      role_attribute_strict: "true"
      role_attribute_path: >-
        contains(entitlements[*], 'Grafana Admins') && 'GrafanaAdmin' ||
        contains(entitlements[*], 'Grafana Editors') && 'Editor' ||
        contains(entitlements[*], 'Grafana Viewers') && 'Viewer'
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    server:
      enable_gzip: "true"
      root_url: https://grafana.${SECRET_DOMAIN}
  deployment:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  httpRoute:
    metadata:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Grafana
        gethomepage.dev/group: Observability
        gethomepage.dev/icon: grafana.png
        gethomepage.dev/description: Dashboards and visualisation
        # Route is named grafana-httproute, so the pods need selecting explicitly.
        # grafana-operator labels the instance pods app=grafana, not
        # app.kubernetes.io/name — that key only matches the operator itself.
        gethomepage.dev/pod-selector: app=grafana
    spec:
      hostnames:
        - "grafana.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: ceph-rbd
  disableDefaultSecurityContext: All
