---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pve-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      pve-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/prompve/prometheus-pve-exporter
              tag: 3.10.0
            env:
              TZ: "${TZ}"
              # Proxmox serves the API with a self-signed certificate.
              PVE_VERIFY_SSL: "false"
            # The exporter reads its whole config from the environment as soon as
            # PVE_USER is set, so no pve.yml is mounted.
            envFrom:
              - secretRef:
                  name: pve-exporter-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9221
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 256Mi }
    defaultPodOptions:
      securityContext:
        # No runAsUser: the image already ships USER prometheus (uid 101).
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9221
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
