---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: ceph-rbd
        size: 50Gi
      retentionPeriod: 90d
      route:
        enabled: true
        annotations:
          # Logs are queried through Grafana, so this needs no tile of its own.
          # isDiscoverable tests for the exact string "true"; anything else excludes.
          gethomepage.dev/enabled: "false"
          gethomepage.dev/name: VictoriaLogs
          gethomepage.dev/group: Observability
          gethomepage.dev/icon: mdi-text-search
          gethomepage.dev/description: Log storage and query
          # Route is named victoria-logs but the pods are labelled victoria-logs-single
          gethomepage.dev/pod-selector: app.kubernetes.io/name=victoria-logs-single
        hostnames:
          - "vlogs.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      serviceMonitor:
        enabled: true
