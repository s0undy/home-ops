---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  values:
    master:
      replicaCount: 1
    worker:
      # The worker has to run on the tainted GPU node jit-talos-04 — the PCI label
      # it produces there is what the Intel GPU device plugin's NodeFeatureRule
      # selects on.
      tolerations:
        - key: gpu.intel.com/i915
          operator: Equal
          value: "true"
          effect: NoSchedule
      config:
        core:
          labelSources: ["pci", "system", "usb"]
    prometheus:
      enable: false