---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-gpu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    name: i915
    nodeFeatureRule: true
    sharedDevNum: 99
    # jit-talos-04 owns the only iGPU and is tainted; this plugin is what advertises
    # gpu.intel.com/i915, so without the toleration the resource never appears at all
    # (and the ks healthCheckExpr on desiredNumberScheduled == numberReady never passes).
    tolerations:
      - key: gpu.intel.com/i915
        operator: Equal
        value: "true"
        effect: NoSchedule