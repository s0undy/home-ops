---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# IOT VLAN 10.0.111.0/24 on ens22. Pods pick a static IP from the reserved
# 10.0.111.200-254 range via their annotation; no routes, so the default
# route stays on the cluster network.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ens22",
          "mode": "bridge",
          "ipam": {
            "type": "static"
          }
        }
      ]
    }
