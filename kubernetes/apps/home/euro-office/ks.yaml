---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: euro-office
spec:
  dependsOn:
    - name: postgres
      namespace: databases
  interval: 1h
  path: ./kubernetes/apps/home/euro-office/app
  postBuild:
    substitute:
      APP: euro-office
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home
  wait: false
