---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app euro-office
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      euro-office:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: euro-office-secret
        containers:
          # The standalone image must run as root: its entrypoint rewrites config
          # under /etc, chowns state and starts supervisord, which drops the
          # services to the `ds` user. It also starts a bundled RabbitMQ, and a
          # bundled redis-server that sits idle, since this build keeps editor
          # state in memory and never connects to Redis.
          app:
            image:
              repository: ghcr.io/euro-office/documentserver
              tag: v9.3.5@sha256:b303064a69d0a4f81ba5945126c4c484fc08bf42436fc97bb85413429e27ba9e
            env:
              TZ: "${TZ}"
              # The entrypoint applies the schema itself, as DB_USER
              DB_HOST: postgres-rw.databases.svc.cluster.local
              DB_NAME: eurooffice
              DB_USER: eurooffice
              # Documents are fetched from https://cloud.${SECRET_DOMAIN}, which
              # resolves internally to the envoy-external address (10.0.100.22)
              ALLOW_PRIVATE_IP_ADDRESS: "true"
            envFrom:
              # JWT_SECRET, SECURE_LINK_SECRET and DB_PWD. Setting both secrets
              # means nothing under /var/www/euro-office/Data needs to persist.
              - secretRef:
                  name: euro-office-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: &port 80
                  periodSeconds: 30
                  timeoutSeconds: 10
              readiness: *probe
              # Font cache generation and RabbitMQ start on every boot
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        # gid of `ds`, which runs docservice/converter and writes App_Data on the
        # PVC. The v9.3.4 entrypoint doesn't repair the volume's ownership
        # (upstream 275a7eb0 adds that later), so a fresh PVC is root-only.
        fsGroup: 107
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "office.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/euro-office/documentserver
