---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nextcloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      nextcloud:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: nextcloud-secret
          # The entrypoint writes redis-session.ini into conf.d whenever REDIS_HOST
          # is set, which fails as non-root on a read-only root filesystem. Seed a
          # writable copy of the image's conf.d for the app container to mount.
          02-php-conf:
            image: &image
              repository: docker.io/library/nextcloud
              tag: 34.0.4-fpm-alpine@sha256:9f75da92261d0993a98098573e0f2d5ca01cfbbbb236f90ad521c388568de94c
            command: ["sh", "-c", "cp -R /usr/local/etc/php/conf.d/. /conf.d/"]
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          # php-fpm; on first start the entrypoint copies the release into
          # /var/www/html and runs the unattended install, later starts upgrade it
          app:
            image: *image
            env: &env
              TZ: "${TZ}"
              POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
              POSTGRES_DB: nextcloud
              REDIS_HOST: nextcloud-dragonfly
              REDIS_HOST_PORT: "6379"
              NEXTCLOUD_DATA_DIR: /var/www/data
              # Only applied by the initial install, managed in config.php afterwards
              NEXTCLOUD_TRUSTED_DOMAINS: &host "cloud.${SECRET_DOMAIN}"
              OVERWRITEPROTOCOL: https
              OVERWRITECLIURL: "https://cloud.${SECRET_DOMAIN}"
              # Envoy pods, so client IPs come from X-Forwarded-For, and the push
              # sidecar, which reaches Nextcloud through nginx on 127.0.0.1
              TRUSTED_PROXIES: 10.42.0.0/16 127.0.0.1
              # NC_<key> env vars override config.php system values
              NC_default_phone_region: SE
              # UTC hour, heavy daily jobs run in the 4h after it (02:00/03:00
              # Stockholm). Only enforced for CLI cron, i.e. the cron container
              NC_maintenance_window_start: "1"
              # Snowflake ID node, 1-511 and never change it. Values < 1 fall back
              # to a hash of the hostname, which is the pod name here
              NC_serverid: "1"
              # Read by config/eurooffice.config.php
              EUROOFFICE_JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: euro-office-secret
                    key: JWT_SECRET
              # Read by the whiteboard.sh before-starting hook
              WHITEBOARD_URL: "https://whiteboard.${SECRET_DOMAIN}"
              WHITEBOARD_JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: whiteboard-secret
                    key: JWT_SECRET_KEY
              PHP_MEMORY_LIMIT: 1G
              # Must match client_max_body_size in nginx.conf
              PHP_UPLOAD_LIMIT: 10G
            envFrom: &envFrom
              - secretRef:
                  name: nextcloud-secret
            probes:
              liveness: &fpmProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *fpmProbe
              # php-fpm only listens once the entrypoint has synced and installed
              # or upgraded Nextcloud, which can take several minutes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9000
                  periodSeconds: 10
                  failureThreshold: 90
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
          # Background jobs every 5 minutes. busybox crond (the image's cron.sh)
          # can't switch to the crontab user without root, so loop instead. The
          # trap plus backgrounded sleep makes SIGTERM end the loop between runs.
          cron:
            image: *image
            command:
              - sh
              - -c
              - |
                trap 'exit 0' TERM INT
                # php-fpm only listens once the entrypoint finished installing/upgrading
                until php -r 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);'; do
                  sleep 10 & wait $!
                done
                while true; do
                  php -f /var/www/html/cron.php
                  sleep 300 & wait $!
                done
            env: *env
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
          # Client Push (notify_push). Runs the binary shipped inside the app so it
          # always matches the installed app version, which `occ notify_push:setup`
          # requires. Database settings come from config.php.
          push:
            image: *image
            command:
              - sh
              - -c
              - |
                trap 'kill -TERM $pid 2>/dev/null; exit 0' TERM INT
                bin=/var/www/html/custom_apps/notify_push/bin/x86_64/notify_push
                # Only exists once the app is installed from the app store
                until [ -x "$bin" ]; do
                  sleep 30 & wait $!
                done
                sum=$(md5sum "$bin")
                "$bin" /var/www/html/config/config.php & pid=$!
                # App updates replace the binary, so exit to restart on the new one
                while kill -0 "$pid" 2>/dev/null; do
                  sleep 60 & wait $!
                  if [ "$(md5sum "$bin" 2>/dev/null)" != "$sum" ]; then
                    echo "notify_push binary changed, restarting"
                    kill -TERM "$pid"
                    wait "$pid"
                    exit 0
                  fi
                done
                wait "$pid"
            env:
              TZ: "${TZ}"
              # Only reachable through nginx's /push/ location
              BIND: 127.0.0.1
              PORT: "7867"
              NEXTCLOUD_URL: http://127.0.0.1:8080
              REDIS_URL: redis://nextcloud-dragonfly:6379
              NO_ANSI: "true"
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
          nginx:
            image:
              repository: ghcr.io/nginx/nginx-unprivileged
              tag: 1.31.6-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
            env:
              NGINX_ENTRYPOINT_QUIET_LOGS: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status.php
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: *host
                  periodSeconds: 15
                  timeoutSeconds: 5
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        # www-data on the alpine image
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Nextcloud
          gethomepage.dev/group: Home
          gethomepage.dev/icon: nextcloud.png
          gethomepage.dev/description: File sync and share
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      # Code, config.php and custom_apps
      html:
        existingClaim: *app
        advancedMounts:
          nextcloud:
            app:
              - path: /var/www/html
            cron:
              - path: /var/www/html
            push:
              - path: /var/www/html
                readOnly: true
            nginx:
              - path: /var/www/html
                readOnly: true
      data:
        type: nfs
        server: horrea-10.${SECRET_DOMAIN}
        path: /mnt/tank/Nextcloud
        advancedMounts:
          nextcloud:
            app:
              - path: /var/www/data
            cron:
              - path: /var/www/data
      php-conf:
        type: emptyDir
        advancedMounts:
          nextcloud:
            02-php-conf:
              - path: /conf.d
            app:
              - path: /usr/local/etc/php/conf.d
      config:
        type: configMap
        name: nextcloud-configmap
        advancedMounts:
          nextcloud:
            app:
              - path: /usr/local/etc/php-fpm.d/zz-tuning.conf
                subPath: zz-tuning.conf
                readOnly: true
              - &eurooffice
                path: /var/www/html/config/eurooffice.config.php
                subPath: eurooffice.config.php
                readOnly: true
            cron:
              - *eurooffice
            nginx:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf
                readOnly: true
      # Entrypoint hooks must be executable, hence a separate mount
      hooks:
        type: configMap
        name: nextcloud-configmap
        defaultMode: 493 # 0755
        advancedMounts:
          nextcloud:
            app:
              - path: /docker-entrypoint-hooks.d/before-starting/whiteboard.sh
                subPath: whiteboard.sh
                readOnly: true
      # PHP upload staging, nginx body buffering and temp paths
      tmp:
        type: emptyDir
        advancedMounts:
          nextcloud:
            app:
              - path: /tmp
            cron:
              - path: /tmp
            nginx:
              - path: /tmp
