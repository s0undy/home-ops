---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./secret.sops.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: nextcloud-configmap
    files:
      - ./resources/nginx.conf
      - ./resources/zz-tuning.conf
generatorOptions:
  disableNameSuffixHash: true
