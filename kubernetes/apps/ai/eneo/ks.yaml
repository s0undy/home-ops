---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eneo
spec:
  components:
    - ../../../../components/dragonfly
  dependsOn:
    - name: dragonfly-operator
      namespace: databases
    - name: postgres
      namespace: databases
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: eneo
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/eneo/app
  postBuild:
    substitute:
      APP: eneo
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
