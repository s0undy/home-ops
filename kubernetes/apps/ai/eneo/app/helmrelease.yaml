---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app eneo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      # API server + general ARQ worker share a pod so audit log exports
      # written by the worker to /tmp/exports can be served by the backend
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Crawls get up to 70s to wind down (compose stop_grace_period)
          terminationGracePeriodSeconds: 70
        initContainers:
          # Creates the role + database; on first creation it also runs
          # /initdb/eneo.sql as superuser, since pgvector is not a trusted extension
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: eneo-secret
          # Alembic migrations, default tenant/user and CORS origin seeding (idempotent)
          02-init-eneo:
            image: &backendImage
              repository: ghcr.io/eneo-ai/eneo-backend
              tag: 2.3.1@sha256:409a530f60ce721e1ef4bda351b2cd73c521eefc4e16ac109b1c3af3bc6354ad
            command: ["python", "init_db.py"]
            env: &backendEnv
              TZ: "${TZ}"
              POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
              POSTGRES_PORT: "5432"
              POSTGRES_DB: eneo
              REDIS_HOST: eneo-dragonfly
              REDIS_PORT: "6379"
              PUBLIC_ORIGIN: "https://eneo.${SECRET_DOMAIN}"
              API_PREFIX: /api/v1
              API_KEY_LENGTH: "64"
              API_KEY_HEADER_NAME: X-API-Key
              JWT_AUDIENCE: "*"
              JWT_ISSUER: ENEO
              JWT_EXPIRY_TIME: "1440"
              JWT_ALGORITHM: HS256
              JWT_TOKEN_PREFIX: Bearer
              # Required in bytes, no defaults upstream; values from backend/.env.template
              UPLOAD_FILE_TO_SESSION_MAX_SIZE: "10485760"
              UPLOAD_IMAGE_TO_SESSION_MAX_SIZE: "10485760"
              UPLOAD_MAX_FILE_SIZE: "10485760"
              TRANSCRIPTION_MAX_FILE_SIZE: "209715200"
              TENANT_CREDENTIALS_ENABLED: "true"
              USING_ACCESS_MANAGEMENT: "true"
              # init_db.py skips tenant/user creation unless all DEFAULT_* are set
              DEFAULT_TENANT_NAME: Home
              DEFAULT_TENANT_QUOTA_LIMIT: "10737418240" # 10GiB, bytes
              DEFAULT_USER_NAME: admin
              DEFAULT_USER_EMAIL: "admin@${SECRET_DOMAIN}"
              LOGLEVEL: INFO
              JSON_LOGS: "true"
              # Single-tenant SSO via Authentik; the login page switches to it
              # once OIDC_CLIENT_ID/OIDC_CLIENT_SECRET exist in eneo-secret.
              # Users are matched by email and must already exist in Eneo.
              # Password login: /login?showUsernameAndPassword=true
              OIDC_DISCOVERY_ENDPOINT: "https://auth.${SECRET_DOMAIN}/application/o/eneo/.well-known/openid-configuration"
              # Bundled MCP tools. Signed file links use the internal address
              # so the runtime needs no route out through Envoy
              TOOL_RUNTIME_URL: http://eneo-tool-runtime.ai.svc.cluster.local:3010
              FILE_REFERENCE_BASE_URL: &backendInternalUrl http://eneo-backend.ai.svc.cluster.local:8000
            envFrom: &backendEnvFrom
              - secretRef:
                  name: eneo-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *backendImage
            env:
              <<: *backendEnv
              NUM_WORKERS: "2"
            envFrom: *backendEnvFrom
            probes:
              # /api/livez is dependency-free, while /api/readyz also fails
              # when the worker or object content storage is unhealthy
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/livez
                    port: &backendPort 8000
                  periodSeconds: 30
                  timeoutSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/readyz
                    port: *backendPort
                  periodSeconds: 15
                  timeoutSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/livez
                    port: *backendPort
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext: *securityContext
            # Each gunicorn worker idles at ~500Mi and keeps its peak after
            # long-context chats (100k+ tokens); 2Gi was OOMKilled with two
            # concurrent chats
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 4Gi
          worker:
            image: *backendImage
            env:
              <<: *backendEnv
              RUN_AS_WORKER: "true"
            envFrom: *backendEnvFrom
            probes:
              # Verifies the ARQ heartbeat in Redis (refreshed every 60s).
              # Each check imports the app, ~10s of CPU on an idle node, so
              # a shorter timeout restarts a healthy worker and fails readyz
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["arq", "--check", "src.eneo.worker.arq.WorkerSettings"]
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 30
                  failureThreshold: 3
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
          # Consumes arq:crawler. Kept in this pod so Recreate stops every
          # writer before 02-init-eneo migrates, as upstream requires
          crawler:
            image: *backendImage
            env:
              <<: *backendEnv
              RUN_AS_WORKER: "true"
              WORKER_ROLE: crawler
            envFrom: *backendEnvFrom
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["arq", "--check", "src.eneo.worker.arq.CrawlerWorkerSettings"]
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 30
                  failureThreshold: 3
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/eneo-ai/eneo-frontend
              tag: 2.3.1@sha256:01f9af481f741ce3b969e555fd6f0e368f3b80fe50f52400d29699c0c357bcde
            env:
              TZ: "${TZ}"
              NODE_ENV: production
              ORIGIN: &origin "https://eneo.${SECRET_DOMAIN}"
              PUBLIC_ORIGIN: *origin
              ENEO_BACKEND_URL: *origin
              PUBLIC_ENEO_BACKEND_URL: *origin
              ENEO_BACKEND_SERVER_URL: http://eneo-backend.ai.svc.cluster.local:8000
              FEDERATION_PER_TENANT_ENABLED: "false"
              SHOW_WEB_SEARCH: "true"
              LOGLEVEL: INFO
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: eneo-secret
                    key: JWT_SECRET
            probes:
              liveness: &frontendProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &frontendPort 3000
                  periodSeconds: 30
              readiness: *frontendProbe
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Runs model-written code, so it stays in its own pod with only the token
      # from eneo-secret, and networkpolicy.yaml confines its traffic
      tool-runtime:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/eneo-ai/eneo-tool-runtime
              tag: 2.3.1@sha256:d261b74d06ac2fff46b1243075867bbfc518c3af0326ec51213405ee89ee8a93
            env:
              TZ: "${TZ}"
              TOOL_RUNTIME_FILE_ORIGINS: *backendInternalUrl
              # Refuse to start or run jobs without Landlock confinement
              TOOL_RUNTIME_REQUIRE_CONFINEMENT: "true"
              TOOL_RUNTIME_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: eneo-secret
                    key: TOOL_RUNTIME_TOKEN
            probes:
              liveness: &toolRuntimeProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: &toolRuntimePort 3010
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *toolRuntimeProbe
            securityContext: *securityContext
            # Limits match the reference compose stack
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                cpu: 2
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      backend:
        controller: backend
        ports:
          http:
            port: *backendPort
      frontend:
        controller: frontend
        ports:
          http:
            port: *frontendPort
      tool-runtime:
        controller: tool-runtime
        ports:
          http:
            port: *toolRuntimePort
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Eneo
          gethomepage.dev/group: AI
          gethomepage.dev/icon: mdi-robot-outline
          gethomepage.dev/description: AI assistant platform
          # Homepage otherwise links to the first rule's path (/api)
          gethomepage.dev/href: "https://eneo.${SECRET_DOMAIN}"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # Mirrors the backend router in Eneo's reference docker-compose
          - matches:
              - path: { type: PathPrefix, value: /api }
              - path: { type: PathPrefix, value: /scim }
              - path: { type: PathPrefix, value: /docs }
              - path: { type: PathPrefix, value: /openapi.json }
              - path: { type: PathPrefix, value: /version }
            backendRefs:
              - identifier: backend
                port: *backendPort
          - backendRefs:
              - identifier: frontend
                port: *frontendPort
    configMaps:
      initdb:
        data:
          # postgres-init runs /initdb/<dbname>.sql only when it creates the database
          eneo.sql: |
            CREATE EXTENSION IF NOT EXISTS vector;
    persistence:
      initdb:
        type: configMap
        identifier: initdb
        advancedMounts:
          backend:
            01-init-db:
              - path: /initdb
      # Shared by API + general worker (uploads staging, /tmp/exports)
      tmp:
        type: emptyDir
        advancedMounts:
          backend:
            02-init-eneo:
              - path: /tmp
            app:
              - path: /tmp
            worker:
              - path: /tmp
          frontend:
            app:
              - path: /tmp
      # Crawler startup recovery needs a private /tmp, so it must not share
      # the volume above, which holds upload staging and audit log exports
      crawler-tmp:
        type: emptyDir
        advancedMounts:
          backend:
            crawler:
              - path: /tmp
      # Job scratch plus the 256MiB tabular cache; counts towards the memory
      # limit. Compose mounts this noexec, which an emptyDir cannot do
      tool-runtime-tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        advancedMounts:
          tool-runtime:
            app:
              - path: /tmp
      # Only holds runtime debug flags (/app/data/debug_flags), nothing persistent
      data:
        type: emptyDir
        advancedMounts:
          backend:
            app:
              - path: /app/data
            worker:
              - path: /app/data
            crawler:
              - path: /app/data
