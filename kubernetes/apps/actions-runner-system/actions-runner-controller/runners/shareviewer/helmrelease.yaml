---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app shareviewer-runner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    # The scale set name workflows target with `runs-on:` defaults to the release name.
    githubConfigUrl: https://github.com/s0undy/ShareViewer
    # Shared with home-ops-runner: same GitHub App installation covers both repos.
    githubConfigSecret: github-app-secret
    minRunners: 0
    maxRunners: 4
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        # RWX/cephfs rather than RWO: in kubernetes mode the runner pod and every
        # workflow job pod mount this same volume, and nothing pins the job pod to
        # the runner's node.
        accessModes: ["ReadWriteMany"]
        storageClassName: cephfs
        resources:
          requests:
            storage: 10Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          runner: *app
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      runner: *app
                  topologyKey: kubernetes.io/hostname
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.338.0@sha256:c867ecdf82d4e8537ea8a41acc6addae09f069daec137e5614b87e4678a953e8
            command: ["/home/runner/run.sh"]
            env:
              # Without this, kubernetes mode refuses any job that does not declare
              # its own `container:`.
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
