---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: actions-runner-controller
      namespace: actions-runner-system
  interval: 1h
  path: ./kubernetes/apps/actions-runner-system/actions-runner-controller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions-runner-system
  # wait: true — the runner scale set below needs the AutoscalingRunnerSet CRD
  # that this chart installs before its own HelmRelease can be applied.
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller-runners
spec:
  dependsOn:
    - name: actions-runner-controller # provides the AutoscalingRunnerSet CRD and the controller SA
  interval: 1h
  path: ./kubernetes/apps/actions-runner-system/actions-runner-controller/runners
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions-runner-system
  # Deliberately no postBuild.substituteFrom: nothing under runners/ references a
  # cluster-secret variable, and the runner's own credentials come from its
  # secret.sops.yaml instead.
  #
  # wait: false — with minRunners: 0 the scale set parks at zero replicas and never
  # reports Ready the way a normal workload does.
  wait: false
