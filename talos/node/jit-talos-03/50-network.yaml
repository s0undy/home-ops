  - gateway: 10.0.100.1
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel1
mtu: 9000
addresses:
  - address: 172.16.52.23/24
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel2
mtu: 9000
addresses:
  - address: 172.16.60.23/24
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel3
addresses:
  - address: 169.254.100.13/32
---
# IOT VLAN (10.0.111.0/24): link is only brought up for the multus `iot`
# macvlan; the node gets a link-local placeholder, not an IOT address.
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel4
addresses:
  - address: 169.254.111.13/32
