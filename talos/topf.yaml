---
clusterName: kubernetes
clusterEndpoint: https://10.0.100.10:6443

# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.14.0
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.1

schematicId: "@schematic.yaml"
secretsPath: talsecret.sops.yaml

nodes:
  - host: jit-talos-01
    ip: 10.0.100.11
    role: control-plane
  - host: jit-talos-02
    ip: 10.0.100.12
    role: control-plane
  - host: jit-talos-03
    ip: 10.0.100.13
    role: control-plane
  # Dedicated GPU node: a deliberately small VM that owns the Intel iGPU, so the
  # 16 GB control plane VMs no longer have to have their RAM pinned by Proxmox
  # for PCI passthrough. Only Jellyfin runs here — see node/jit-talos-04/10-kube-node.yaml.
  - host: jit-talos-04
    ip: 10.0.100.14
    role: worker
